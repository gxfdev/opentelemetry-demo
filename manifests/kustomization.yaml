apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - opentelemetry-demo.yaml
namespace: otel-demo-cicd

# 1. 统一给所有工作负载注入私有仓库的拉取凭证
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: harbor-cred
  - target:
      kind: DaemonSet
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: harbor-cred
  - target:
      kind: StatefulSet
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: harbor-cred

# 2. 统一接管所有镜像：替换为你 Harbor 的地址，并强制指定 Tag
images:
  # ================= 业务镜像 (全部指向你的 Harbor, Tag 统一写死为 "1") =================
  - name: ghcr.io/open-telemetry/demo
    newName: 192.168.151.208:30002/library/otel-demo
    newTag: "1"
  # 如果你之前的 YAML 已经被 sed 改成了带 192.168.151.208 的地址，就用下面的列表：
  - name: 192.168.151.208:30002/library/otel-demo-accounting
    newTag: "1"
  - name: 192.168.151.208:30002/library/otel-demo-ad
    newTag: "1"
  - name: 192.168.151.208:30002/library/otel-demo-agent
    newTag: "1"
  - name: 192.168.151.208:30002/library/otel-demo-cart
    newTag: "1"
  - name: 192.168.151.208:30002/library/otel-demo-chatbot
    newTag: "1"
  - name: 192.168.151.208:30002/library/otel-demo-checkout
    newTag: "1"
  - name: 192.168.151.208:30002/library/otel-demo-currency
    newTag: "1"
  - name: 192.168.151.208:30002/library/otel-demo-email
    newTag: "1"
  - name: 192.168.151.208:30002/library/otel-demo-fraud-detection
    newTag: "1"
  - name: 192.168.151.208:30002/library/otel-demo-frontend
    newTag: "1"
  - name: 192.168.151.208:30002/library/otel-demo-frontend-proxy
    newTag: "1"
  - name: 192.168.151.208:30002/library/otel-demo-image-provider
    newTag: "1"
  - name: 192.168.151.208:30002/library/otel-demo-kafka
